# No volume, so removing the container wipes the seeded spans. Single-tenant, like the AppHost's Tempo.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # The seed reads its spans back the moment it pushes them, so they must land fast.
  trace_idle_period: 1s
  flush_check_period: 1s
  max_block_duration: 5s
  lifecycler:
    min_ready_duration: 0s

query_frontend:
  search:
    # Without this a search made just after the flush finds nothing.
    query_backend_after: 0s

compactor:
  compaction:
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    blocklist_poll: 1s

usage_report:
  reporting_enabled: false
