# No volume, so removing the container wipes the seeded events. Single-tenant, like the AppHost's Loki.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # The seed writes a month of past events in one go.
  reject_old_samples: false
  split_queries_by_interval: 24h
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  per_stream_rate_limit: 64MB
  per_stream_rate_limit_burst: 128MB

query_range:
  cache_results: false
  cache_index_stats_results: false

ingester:
  query_store_max_look_back_period: -1
  max_chunk_age: 17520h
  lifecycler:
    min_ready_duration: 0s
    final_sleep: 0s
