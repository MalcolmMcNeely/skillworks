# Multi-tenant, so tests in parallel never see each other's spans. One developer's store needs no tenant.
multitenancy_enabled: true

server:
  http_listen_port: 3200
  # Quiet, so a failing test's output is the test's own. It moves nothing a search answers.
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # A test reads the moment it pushes, so its span must land fast. Speed only: the answer is the same.
  trace_idle_period: 1s
  flush_check_period: 1s
  max_block_duration: 5s
  lifecycler:
    # Ready at once, so a test run does not sit out the start-up pause. Nothing it answers changes.
    min_ready_duration: 0s

query_frontend:
  search:
    # Every test reads days at a time, and the default caps a read at a week.
    max_duration: 0s
    # Without this a test that flushes and reads at once finds nothing. A real read comes long after.
    query_backend_after: 0s

compactor:
  compaction:
    # As long as a developer's store keeps a span, so a test may date one as far back as a reader can ask.
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    # A block just pushed is listed at once, so no test waits on it. A search covers the same spans.
    blocklist_poll: 1s

usage_report:
  reporting_enabled: false
