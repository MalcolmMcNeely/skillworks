# Multi-tenant, so tests in parallel, each with its own tenant, never see each other's spans.
multitenancy_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # A span is found by search only once its block has reached the store, and every test reads at once.
  trace_idle_period: 1s
  flush_check_period: 1s
  max_block_duration: 5s
  lifecycler:
    min_ready_duration: 0s

query_frontend:
  search:
    # Every test reads days at a time, and the default caps a read at a week.
    max_duration: 0s
    # Tempo keeps the newest spans out of the store half of a read, and a test's are always new.
    query_backend_after: 0s

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    blocklist_poll: 1s

usage_report:
  reporting_enabled: false
