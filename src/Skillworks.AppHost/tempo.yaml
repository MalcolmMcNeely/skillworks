# Tempo ships no usable default configuration, so unlike Loki it receives nothing without this file.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Past half an hour the store answers from filed Batches alone, and by default holds one open exactly as long.
  max_block_duration: 5m

compactor:
  compaction:
    # Twice the lookback, so a reader who widens the span still finds spans behind it.
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  # Studio runs on a developer's machine, and what they measure is theirs.
  reporting_enabled: false
